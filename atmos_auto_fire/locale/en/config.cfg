[mod-name]
atmos_auto_fire=Atmos Auto Fire

[mod-description]
atmos_auto_fire=Automatically fires the held weapon (shotgun, pistol, SMG, rocket launcher, any modded gun) at prioritized enemies. Each weapon can be switched on or off. The character fires itself, with native spread, cooldown, and ammo use.

[shortcut-name]
atmos-auto-fire-toggle=Toggle auto fire

[controls]
atmos-auto-fire-toggle=Toggle auto fire

