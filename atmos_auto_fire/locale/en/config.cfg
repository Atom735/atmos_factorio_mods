debug-tooltip=Circles: weapon range (gray), shorter rule ranges (blue).\nEnemies: green = target, yellow = allowed, red = line of fire blocked, gray = no matching rule. The number is the matching allow row.\nRectangles: own buildings checked for line of fire, red = blocking. Lines: shot cones.
allow-title=Allow / priority
allow-hint=Higher rows are checked first. ★ All matches any enemy. Distance is meters or % of the held weapon range.
