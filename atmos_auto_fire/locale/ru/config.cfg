[mod-name]
atmos_auto_fire=Atmos Auto Fire

[mod-description]
atmos_auto_fire=Автоматически стреляет из оружия в руках (дробовик, пистолет, автомат, ракетница, любое оружие из модов) по целям в заданном порядке. Каждое оружие можно включить или выключить. Стреляет сам персонаж, с родным разбросом, кулдауном и расходом патронов.

[shortcut-name]
atmos-auto-fire-toggle=Переключить автострельбу

[controls]
atmos-auto-fire-toggle=Переключить автострельбу

