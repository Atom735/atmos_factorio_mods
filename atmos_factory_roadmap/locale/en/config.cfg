[mod-name]
Atmos-Factory-Roadmap=Atmos Factory Roadmap

[mod-description]
Atmos-Factory-Roadmap=Interactive progression guide: detects your current game stage and tells you what to build next, with golden ratios. GUI only.

[atmos-roadmap]
title=What to build next
button-tooltip=Progression guide: what to build next
current-tooltip=Jump to the current stage (__1__) and follow it automatically
stage-header=Stage __1__/__2__: __3__
status-current=[color=yellow]You are here.[/color]
status-done=[color=green]Stage complete.[/color]
status-skipped=[color=orange]Unfinished earlier stage - worth catching up.[/color]
status-future=[color=gray]Upcoming stage.[/color]
goals=Goals:
tips=Tips and ratios:
goal-build=Build __1__ __2__: __3__/__4__
goal-produce=Produce __1__ __2__: __3__/__4__
goal-research=Research __1__ __2__
stage-complete=[color=green]Stage complete:[/color] __1__
stage-next=Next stage: __1__ - open the [item=lab] guide button for details.

stage-start-title=Starter kit
stage-start-desc=Hand-craft burner mining drills on iron, coal and stone, and feed stone furnaces. Goal: a steady trickle of iron and copper plates without manual mining.
stage-start-tips=- Burner drill: 0.25 ore/s. 2 drills on iron feed ~1.5 stone furnaces.\n- Put a burner drill on coal facing another coal drill: they fuel each other.\n- Craft 2-3 drills on copper as well.

stage-power-title=Electricity and research
stage-power-desc=Build the first steam power plant, a lab and a few assemblers. Start research with red science packs.
stage-power-tips=- Golden power ratio: 1 offshore pump : 20 boilers : 40 steam engines.\n- 1 boiler : 2 steam engines = 1.8 MW.\n- Automate red science first: 1 gear assembler feeds 5 red science assemblers.

stage-smelting-title=Smelting columns
stage-smelting-desc=Build a full column of furnaces for iron and a half column for copper fed by electric drills. This is the base for the mini mall.
stage-smelting-tips=- Full yellow belt (15/s) = 48 stone furnaces or 30 electric drills.\n- Iron: full column (48 furnaces), copper: half column (24 furnaces).\n- Electric drill: 0.5 ore/s; stone furnace: 0.3125 plate/s.

stage-mini_mall-title=Mini mall
stage-mini_mall-desc=Automate gears and green circuits, then belts, inserters and other building blocks so you stop hand-crafting.
stage-mini_mall-tips=- Green circuits: 3 copper cable assemblers : 2 circuit assemblers.\n- 1 gear assembler (AM1) makes 1 gear/s.\n- Mall order: belts, inserters, drills, furnaces, assemblers, poles.

stage-science-title=Expansion and red/green science
stage-science-desc=Add more drills and furnace columns, upgrade the mini mall into a medium mall and divert part of the plates into red and green science.
stage-science-tips=- Equal output: 5 red science : 6 green science assemblers.\n- Green science: 12 science : 1 inserter : 1 belt assembler (half the belt assembler is enough).\n- 10 labs is a good first research block.

stage-power2-title=Power upgrade
stage-power2-desc=Your factory is growing - check that power satisfaction stays at 100%. Expand the steam plant and switch to assembling machine 2.
stage-power2-tips=- Hover over a power pole and check the graph: if demand reaches capacity, build more.\n- 1 offshore pump : 20 boilers : 40 steam engines (36 MW).\n- Keep a coal buffer belt for boilers.

stage-military-title=Military science and steel
stage-military-desc=Build columns for stone bricks, stone walls, coal and a separate iron/steel/copper column only for military science. Defend your base with turrets.
stage-military-tips=- Steel: 1 iron furnace : 1 steel furnace.\n- Military science: 10 s for 2 packs = 5 s per pack (same pace as red).\n- Ingredients: piercing ammo, grenades, walls.

stage-oil-title=Oil processing
stage-oil-desc=Check power again, extend the mall with chemical plants and refineries, set up pumpjacks and increase ore mining.
stage-oil-tips=- Basic oil processing is fine to start; switch to advanced soon.\n- Plastic: 1 chemical plant makes 1 plastic/s.\n- Separate furnace columns for blue science materials (iron, copper, steel).

stage-chemical-title=Chemical science
stage-chemical-desc=Build dedicated furnace columns for blue science, produce advanced circuits and engines, move to advanced oil processing.
stage-chemical-tips=- Equal output: 5 red : 6 green : 12 blue science assemblers.\n- Advanced oil: 20 refineries : 5 heavy cracking : 17 light cracking.\n- Engines: 10 s each, build plenty of engine assemblers.

stage-production-title=Production science
stage-production-desc=Separate production lines for purple science: electric furnaces, productivity modules and rails. Consider solar power.
stage-production-tips=- Purple science: 21 s for 3 packs = 7 s per pack.\n- Ratio: 5 red : 6 green : 12 blue : 7 purple.\n- Solar: 25 solar panels : 21 accumulators.

stage-utility-title=Utility science
stage-utility-desc=Build a processing unit line, low density structures and flying robot frames for yellow science. Nuclear power helps a lot here.
stage-utility-tips=- Yellow science: 21 s for 3 packs = 7 s per pack (same as purple).\n- Processing units need lots of green circuits: plan 20 green : 2 red circuits per blue.\n- Nuclear: 1 reactor : 4 heat exchangers : 7 turbines.

stage-rocket-title=Rocket launch
stage-rocket-desc=Research the rocket silo, build it and feed rocket parts. Then keep scaling all science.
stage-rocket-tips=- A rocket needs 50 rocket parts (Factorio 2.x).\n- Use speed and productivity modules in the silo.\n- After launch: infinite research and megabase scaling.
