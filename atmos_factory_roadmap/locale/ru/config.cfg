[mod-name]
Atmos-Factory-Roadmap=Atmos Factory Roadmap

[mod-description]
Atmos-Factory-Roadmap=Интерактивный гид по развитию: определяет текущий этап игры и подсказывает, что строить дальше, с золотыми соотношениями. Только интерфейс.

[atmos-roadmap]
title=Что строить дальше
button-tooltip=Гид по развитию: что строить дальше
current-tooltip=Перейти к текущему этапу (__1__) и следовать за ним автоматически
stage-header=Этап __1__/__2__: __3__
status-current=[color=yellow]Вы здесь.[/color]
status-done=[color=green]Этап пройден.[/color]
status-skipped=[color=orange]Незавершённый ранний этап — стоит доделать.[/color]
status-future=[color=gray]Будущий этап.[/color]
goals=Цели:
tips=Подсказки и соотношения:
goal-build=Построить __1__ __2__: __3__/__4__
goal-produce=Произвести __1__ __2__: __3__/__4__
goal-research=Изучить __1__ __2__
stage-complete=[color=green]Этап пройден:[/color] __1__
stage-next=Следующий этап: __1__ — подробности по кнопке гида [item=lab].

stage-start-title=Стартовый комплект
stage-start-desc=Скрафтите твердотопливные буры на железо, уголь и камень, загрузите каменные печи. Цель — стабильный поток железных и медных плит без ручной добычи.
stage-start-tips=- Твердотопливный бур: 0,25 руды/с. 2 бура на железе кормят ~1,5 каменной печи.\n- Поставьте угольный бур выходом в другой угольный бур — они заправляют друг друга.\n- Поставьте 2-3 бура и на медь.

stage-power-title=Электричество и исследования
stage-power-desc=Постройте первую паровую электростанцию, лабораторию и несколько сборочных автоматов. Начните исследования красными колбами.
stage-power-tips=- Золотое соотношение энергии: 1 насос : 20 бойлеров : 40 паровых двигателей.\n- 1 бойлер : 2 двигателя = 1,8 МВт.\n- Сначала автоматизируйте красные колбы: 1 автомат шестерёнок кормит 5 автоматов красных колб.

stage-smelting-title=Колонны печей
stage-smelting-desc=Постройте полную колонну печей под железо и половинчатую под медь, питаемые электробурами. Это основа мини-молла.
stage-smelting-tips=- Полная жёлтая лента (15/с) = 48 каменных печей или 30 электробуров.\n- Железо: полная колонна (48 печей), медь: половина (24 печи).\n- Электробур: 0,5 руды/с; каменная печь: 0,3125 плиты/с.

stage-mini_mall-title=Мини-молл
stage-mini_mall-desc=Автоматизируйте шестерёнки и зелёные схемы, затем ленты, манипуляторы и прочие стройматериалы, чтобы больше не крафтить руками.
stage-mini_mall-tips=- Зелёные схемы: 3 автомата медного провода : 2 автомата схем.\n- 1 автомат шестерёнок (АМ1) даёт 1 шестерёнку/с.\n- Порядок молла: ленты, манипуляторы, буры, печи, автоматы, столбы.

stage-science-title=Расширение и красные/зелёные колбы
stage-science-desc=Добавьте буров и колонн печей, улучшите мини-молл до среднего и отведите часть плит на красные и зелёные колбы.
stage-science-tips=- Равный выход: 5 автоматов красных : 6 автоматов зелёных колб.\n- Зелёные колбы: 12 автоматов колб : 1 автомат манипуляторов : 1 автомат лент (автомата лент хватит и половины).\n- 10 лабораторий — хороший первый исследовательский блок.

stage-power2-title=Улучшение электростанции
stage-power2-desc=Завод растёт — проверьте, что энергоснабжение остаётся на 100%. Расширьте паровую станцию и переходите на сборочный автомат 2.
stage-power2-tips=- Наведите на столб и посмотрите график: если потребление упирается в мощность — стройте ещё.\n- 1 насос : 20 бойлеров : 40 паровых двигателей (36 МВт).\n- Держите буферную ленту угля для бойлеров.

stage-military-title=Военные колбы и сталь
stage-military-desc=Постройте колонны под кирпич, каменные стены, уголь и отдельную колонну железа/стали/меди только под военные колбы. Защитите базу турелями.
stage-military-tips=- Сталь: 1 печь железа : 1 печь стали.\n- Военные колбы: 10 с на 2 колбы = 5 с на колбу (темп как у красных).\n- Ингредиенты: бронебойные патроны, гранаты, стены.

stage-oil-title=Нефтепереработка
stage-oil-desc=Снова проверьте энергию, добавьте в молл химзаводы и НПЗ, поставьте насосы-качалки и увеличьте добычу руды.
stage-oil-tips=- Для старта хватит базовой переработки, но скоро переходите на продвинутую.\n- Пластик: 1 химзавод даёт 1 пластик/с.\n- Отдельные колонны печей под материалы синих колб (железо, медь, сталь).

stage-chemical-title=Химические колбы
stage-chemical-desc=Постройте отдельные колонны печей под синие колбы, производите красные схемы и двигатели, переходите на продвинутую нефтепереработку.
stage-chemical-tips=- Равный выход: 5 красных : 6 зелёных : 12 синих автоматов колб.\n- Продвинутая нефть: 20 НПЗ : 5 крекинга тяжёлой : 17 крекинга лёгкой.\n- Двигатели: 10 с каждый, автоматов двигателей нужно много.

stage-production-title=Производственные колбы
stage-production-desc=Отдельные линии под фиолетовые колбы: электропечи, модули продуктивности и рельсы. Подумайте о солнечной энергии.
stage-production-tips=- Фиолетовые колбы: 21 с на 3 колбы = 7 с на колбу.\n- Соотношение: 5 красных : 6 зелёных : 12 синих : 7 фиолетовых.\n- Солнце: 25 панелей : 21 аккумулятор.

stage-utility-title=Колбы использования
stage-utility-desc=Постройте линию процессоров, малоплотных конструкций и каркасов роботов под жёлтые колбы. Атомная энергия здесь очень поможет.
stage-utility-tips=- Жёлтые колбы: 21 с на 3 колбы = 7 с на колбу (как фиолетовые).\n- Процессорам нужно много зелёных схем: 20 зелёных : 2 красных на один процессор.\n- Атом: 1 реактор : 4 теплообменника : 7 турбин.

stage-rocket-title=Запуск ракеты
stage-rocket-desc=Изучите ракетную шахту, постройте её и подавайте части ракеты. Дальше — масштабирование всех колб.
stage-rocket-tips=- Ракете нужно 50 частей (Factorio 2.x).\n- Ставьте в шахту модули скорости и продуктивности.\n- После запуска: бесконечные исследования и мегабаза.
