stage-start-title=Equipo inicial
stage-start-desc=Fabrica perforadoras a combustión, colócalas sobre hierro, carbón y piedra, y abastece los hornos de piedra. El objetivo es conseguir un pequeño suministro continuo de placas de hierro y de cobre con las perforadoras.
stage-start-tips=- Una perforadora a combustión extrae 0,25 unidades de mineral por segundo. Dos perforadoras de hierro abastecen a unos 1,5 hornos de piedra.\n- Coloca dos perforadoras a combustión enfrentadas sobre el carbón para que se alimenten entre sí.\n- Fabrica también 2 o 3 perforadoras para el cobre.

stage-power-title=Electricidad e investigación
stage-power-desc=Construye tu primera central de vapor, un laboratorio y unas cuantas máquinas de ensamblaje. Empieza a investigar con paquetes de ciencia rojos.
stage-power-tips=- Proporción para el vapor · 1 bomba costera por cada 20 calderas y 40 motores de vapor.\n- 1 caldera abastece a 2 motores de vapor, que juntos generan 1,8 MW.\n- Automatiza primero la ciencia roja. Una ensambladora de engranajes abastece a 5 ensambladoras de ciencia roja.

stage-smelting-title=Columnas de fundición
stage-smelting-desc=Construye una columna completa de hornos para el hierro y media columna para el cobre. Abastécelas con perforadoras eléctricas. Con ellas podrás alimentar el taller inicial.
stage-smelting-tips=- Una cinta amarilla llena transporta 15 unidades por segundo, lo que equivale a la producción de 48 hornos de piedra o a la extracción de 30 perforadoras eléctricas.\n- Hierro con una columna completa de 48 hornos y cobre con media columna de 24 hornos.\n- Una perforadora eléctrica extrae 0,5 unidades de mineral por segundo. Un horno de piedra produce 0,3125 placas por segundo.

stage-mini_mall-title=Taller inicial
stage-mini_mall-desc=Automatiza los engranajes y los circuitos verdes. Después, automatiza las cintas, los insertadores y el resto de piezas que usas para construir.
stage-mini_mall-tips=- Para fabricar circuitos verdes, usa 3 ensambladoras de cable de cobre por cada 2 de circuitos.\n- Una máquina de ensamblaje 1 fabrica 1 engranaje por segundo.\n- Añade al taller, en este orden, cintas, insertadores, perforadoras, hornos, ensambladoras y postes eléctricos.

stage-science-title=Expansión y ciencia roja y verde
stage-science-desc=Añade más perforadoras y columnas de hornos, amplía el taller inicial y destina parte de las placas a fabricar paquetes de ciencia rojos y verdes.
stage-science-tips=- Para producir la misma cantidad de ambos colores, usa 5 ensambladoras de ciencia roja por cada 6 de ciencia verde.\n- Para 12 ensambladoras de ciencia verde, usa 1 de insertadores y 1 de cintas. La ensambladora de cintas solo necesita funcionar a media capacidad.\n- Un bloque de 10 laboratorios es un buen punto de partida.

stage-power2-title=Ampliación de la red eléctrica
stage-power2-desc=Tu fábrica está creciendo. Comprueba que la red sigue cubriendo el 100 % de la demanda. Amplía la central de vapor y pasa a la máquina de ensamblaje 2.
stage-power2-tips=- Consulta el gráfico de la red eléctrica en un poste. Si la demanda alcanza la capacidad de generación, amplía la producción.\n- 1 bomba costera por cada 20 calderas y 40 motores de vapor (36 MW).\n- Mantén una cinta con una reserva de carbón para las calderas.

stage-military-title=Ciencia militar y acero
stage-military-desc=Prepara líneas de carbón, ladrillos de piedra y muros. Dedica otras líneas de hierro, acero y cobre a la ciencia militar. Defiende tu base con torretas.
stage-military-tips=- Para producir acero, usa 1 horno que funda hierro por cada horno que fabrique acero.\n- La ciencia militar tarda 10 segundos en fabricar 2 paquetes. Son 5 segundos por paquete, como en la ciencia roja.\n- Ingredientes de la ciencia militar · munición penetrante, granadas y muros.

stage-oil-title=Procesamiento de petróleo
stage-oil-desc=Vuelve a comprobar la red eléctrica, amplía el taller con plantas químicas y refinerías, instala bombas extractoras y aumenta la extracción de mineral.
stage-oil-tips=- Empieza con el procesamiento básico de petróleo y pasa pronto al avanzado.\n- Una planta química fabrica 1 barra de plástico por segundo.\n- Dedica columnas de hornos de hierro, cobre y acero a la ciencia azul.

stage-chemical-title=Ciencia química
stage-chemical-desc=Construye columnas de hornos para la ciencia azul, fabrica circuitos electrónicos avanzados y motores, y pasa al procesamiento de petróleo avanzado.
stage-chemical-tips=- Para igualar la producción, usa 5 ensambladoras de ciencia roja, 6 de verde y 12 de azul.\n- Procesamiento avanzado de petróleo · 20 refinerías, 5 plantas para destilar petróleo pesado y 17 para destilar petróleo ligero.\n- Cada motor tarda 10 segundos en fabricarse. Monta varias ensambladoras para producirlos.

stage-production-title=Ciencia de producción
stage-production-desc=Separa las líneas de producción de hornos eléctricos, módulos de productividad y raíles para la ciencia morada. Valora instalar energía solar.
stage-production-tips=- La ciencia morada tarda 21 segundos en fabricar 3 paquetes. Son 7 segundos por paquete.\n- Para igualar la producción, usa 5 ensambladoras de ciencia roja, 6 de verde, 12 de azul y 7 de morada.\n- Energía solar · 25 paneles solares por cada 21 acumuladores.

stage-utility-title=Ciencia de utilidad
stage-utility-desc=Prepara una línea de unidades de procesamiento, estructuras de baja densidad y estructuras de robots voladores para la ciencia amarilla. La energía nuclear resulta útil en esta etapa.
stage-utility-tips=- La ciencia amarilla tarda 21 segundos en fabricar 3 paquetes. Son 7 segundos por paquete, como en la ciencia morada.\n- Cada unidad de procesamiento necesita 20 circuitos verdes y 2 circuitos rojos. Prevé suficiente producción de circuitos verdes.\n- Energía nuclear · 1 reactor por cada 4 intercambiadores de calor y 7 turbinas de vapor.

stage-rocket-title=Lanzamiento del cohete
stage-rocket-desc=Investiga el silo de cohetes espaciales, constrúyelo y aliméntalo para fabricar las piezas del cohete. Después, sigue ampliando la producción de todos los tipos de ciencia.
stage-rocket-tips=- Un cohete necesita 50 piezas de cohete (Factorio 2.x).\n- Usa módulos de velocidad y productividad en el silo.\n- Tras el lanzamiento, puedes dedicarte a la investigación infinita y seguir ampliando la fábrica.
