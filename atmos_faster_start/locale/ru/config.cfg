[mod-name]
Atmos-Faster-Start=Atmos Faster Start

[mod-description]
Atmos-Faster-Start=Каждый игрок получает виртуальные стартовые очки и тратит их в окне на любые предметы (цена считается по рецептам игры) или на классический набор Faster Start. Не добавляет и не меняет рецепты. Основан на Faster Start от trad_emark.

[atmos-faster-start]
title=Быстрый старт
button-tooltip=Потратить стартовые очки
points=Стартовые очки: [font=default-bold]__1__[/font]
take-pack=Взять стандартный набор (__1__ очков)
pack-tooltip=Классический набор Faster Start: конвейеры, манипуляторы, печи, сборщики, энергетика, силовая броня с модулями.
pack-taken=Стандартный набор уже взят.
buy-label=Или купить любой предмет:
stack=Стак
cost=Цена: __1__
unit-cost=Цена за штуку: __1__ очков (по рецептам)
unit-cost-unknown=Цена за штуку: __1__ очков (цепочка рецептов не найдена, цена по умолчанию)
buy=Купить
no-character=Нужен персонаж, чтобы получить предметы.
inventory-full=Инвентарь полон, ничего не куплено.
partial=Поместилось только __1__ из __2__; оплачены только они.
item-bought=Куплено __1__ × __2__ за __3__ очков. Осталось: __4__.
pack-bought=Стандартный набор взят за __1__ очков. Осталось: __2__.
points-changed=Ваши стартовые очки: __1__.
admin-only=Эту команду могут использовать только админы.
unknown-player=Неизвестный игрок: __1__
command-add-help=<количество> [игрок|all] - добавить (или отнять отрицательным числом) стартовые очки. Только для админов.
command-reset-help=[игрок|all] - сбросить стартовые очки до начального значения и снова разрешить стандартный набор. Только для админов.
command-open-help=Открыть окно быстрого старта.

[mod-setting-name]
atmos-faster-start-points=Стартовые очки на игрока
atmos-faster-start-cost-multiplier=Множитель цен
atmos-faster-start-unknown-cost=Цена предметов без цепочки рецептов
atmos-faster-start-skip-crash-site=Пропустить место крушения и интро

[mod-setting-description]
atmos-faster-start-points=Сколько очков получает каждый новый игрок. 0 = ровно цена стандартного набора.
atmos-faster-start-cost-multiplier=Умножает цену каждого предмета (и стандартного набора).
atmos-faster-start-unknown-cost=Очков за штуку, если цену нельзя вывести из рецептов и сырья.
atmos-faster-start-skip-crash-site=Отключить место крушения и интро во фриплее, как в оригинальном Faster Start.
