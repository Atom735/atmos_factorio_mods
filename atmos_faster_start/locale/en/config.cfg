[mod-name]
Atmos-Faster-Start=Atmos Faster Start

[mod-description]
Atmos-Faster-Start=Every player gets virtual start points to spend in a GUI on any item, priced from the game's own recipes, the classic Faster Start pack, or a loaded blueprint (full set or only missing items). Does not add or change recipes. Based on Faster Start by trad_emark.

[atmos-faster-start]
title=Faster start
button-tooltip=Spend your start points
points=Start points: [font=default-bold]__1__[/font]
take-pack=Take default pack (__1__ points)
pack-tooltip=The classic Faster Start kit: belts, inserters, furnaces, assemblers, power, power armor with equipment.
pack-taken=Default pack already taken.
buy-label=Or buy any item:
stack=Stack
cost=Cost: __1__
unit-cost=Price per item: __1__ points (from recipes)
unit-cost-unknown=Price per item: __1__ points (no recipe chain found, default price)
buy=Buy
bp-label=Or buy from a blueprint:
bp-load=Load from cursor
bp-load-tooltip=Hold a blueprint (or a book with an active blueprint) and click to load its item list.
bp-status-empty=No blueprint loaded.
bp-status=Loaded: __1__ item types
bp-status-named=Loaded: __1__ (__2__ item types)
bp-buy-full=Buy full set (__1__ points)
bp-buy-missing=Buy missing (__1__ points)
bp-buy-full-tooltip=Buy every item required to build the loaded blueprint.
bp-buy-missing-tooltip=Buy only items missing from your main inventory.
bp-loaded=Blueprint loaded (__1__ item types).
bp-no-blueprint=Hold a set-up blueprint (or active book page) to load it.
bp-empty=That blueprint has no buildable items.
bp-nothing-missing=You already have everything from this blueprint in your main inventory.
bp-bought-full=Bought full blueprint set for __1__ points. Left: __2__.
bp-bought-missing=Bought missing blueprint items for __1__ points. Left: __2__.
no-character=You need a character to receive items.
inventory-full=Inventory is full, nothing was bought.
partial=Only __1__ of __2__ fit into the inventory; you paid only for those.
item-bought=Bought __1__ × __2__ for __3__ points. Left: __4__.
pack-bought=Default pack taken for __1__ points. Left: __2__.
points-changed=Your start points: __1__.
admin-only=Only admins can use this command.
unknown-player=Unknown player: __1__
command-add-help=<amount> [player|all] - add (or remove with a negative amount) start points. Admin only.
command-reset-help=[player|all] - reset start points to the starting value and allow the default pack again. Admin only.
command-open-help=Open the faster start window.

[mod-setting-name]
atmos-faster-start-points=Start points per player
atmos-faster-start-cost-multiplier=Price multiplier
atmos-faster-start-unknown-cost=Price of items without a recipe chain
atmos-faster-start-skip-crash-site=Skip crash site and intro

[mod-setting-description]
atmos-faster-start-points=Points every new player receives. 0 = exactly the price of the default pack.
atmos-faster-start-cost-multiplier=Multiplies every item price (and the default pack price).
atmos-faster-start-unknown-cost=Points per item when its price cannot be derived from recipes and raw resources.
atmos-faster-start-skip-crash-site=Disable the freeplay crash site and intro, like the original Faster Start.
