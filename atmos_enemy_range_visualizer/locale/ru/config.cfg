[mod-name]
Atmos-Enemy-Range-Visualizer=Atmos Enemy Range Visualizer

[mod-description]
Atmos-Enemy-Range-Visualizer=Показывает круги дальности атаки вокруг вражеских червей, турелей и артиллерии. Цвета по типам, стили заливки/контура, шорткат и игровая панель. Рекомендуемый компаньон: Gun Range Visualizer.

[shortcut-name]
atmos-enemy-range-toggle=Переключить визуализацию вражеской дальности

[controls]
atmos-enemy-range-toggle=Переключить визуализацию вражеской дальности
atmos-enemy-range-panel=Панель визуализации вражеской дальности

[atmos-enemy-range]
open-settings=Настройки визуализации вражеской дальности
panel-title=Визуализация вражеской дальности
enable=Показывать дальность врагов
style-label=Стиль отображения
show-lines=Линии к врагам
show-lines-tooltip=Рисовать линию от персонажа к каждой видимой вражеской турели и червю. Прозрачность и толщина: Настройки модов.
categories-label=Типы врагов
cat-worms=Черви
cat-ammo=Стрелковые турели
cat-electric=Электро / лазерные турели
cat-fluid=Жидкостные / огнемётные турели
cat-artillery=Артиллерия
hint-colors=Цвета и радиус поиска: Настройки → Настройки модов
close=Закрыть
refresh=Обновить

[mod-setting-name]
atmos-enemy-range-style=Стиль круга дальности
atmos-enemy-range-search-radius=Радиус поиска (тайлы)
atmos-enemy-range-outline-width=Толщина контура (пиксели)
atmos-enemy-range-show-lines=Линии к врагам
atmos-enemy-range-line-alpha=Непрозрачность линий
atmos-enemy-range-line-width=Толщина линий (пиксели)
atmos-enemy-range-show-worms=Показывать дальность червей
atmos-enemy-range-show-ammo-turrets=Показывать дальность стрелковых турелей
atmos-enemy-range-show-electric-turrets=Показывать дальность электротурелей
atmos-enemy-range-show-fluid-turrets=Показывать дальность жидкостных турелей
atmos-enemy-range-show-artillery=Показывать дальность артиллерии
atmos-enemy-range-color-worms=Цвет дальности червей
atmos-enemy-range-color-ammo=Цвет дальности стрелковых турелей
atmos-enemy-range-color-electric=Цвет дальности электротурелей
atmos-enemy-range-color-fluid=Цвет дальности жидкостных турелей
atmos-enemy-range-color-artillery=Цвет дальности артиллерии

[mod-setting-description]
atmos-enemy-range-style=Залитый круг, только контур или заливка с контуром.
atmos-enemy-range-search-radius=Как далеко от игрока искать вражеские укрепления.
atmos-enemy-range-outline-width=Толщина линии для контурных стилей.
atmos-enemy-range-show-lines=Рисовать линии от персонажа к вражеским турелям и червям цветом категории (панель может переопределить в сессии).
atmos-enemy-range-line-alpha=Альфа линий (0.05–1). Сам цвет берётся из настройки цвета категории.
atmos-enemy-range-line-width=Толщина линий к врагам.
atmos-enemy-range-show-worms=Значение по умолчанию для червей (панель может переопределить в сессии).
atmos-enemy-range-show-ammo-turrets=Значение по умолчанию для стрелковых турелей (панель может переопределить в сессии).
atmos-enemy-range-show-electric-turrets=Значение по умолчанию для электро/лазерных турелей (панель может переопределить в сессии).
atmos-enemy-range-show-fluid-turrets=Значение по умолчанию для жидкостных/огнемётных турелей (панель может переопределить в сессии).
atmos-enemy-range-show-artillery=Значение по умолчанию для артиллерии (панель может переопределить в сессии).

[string-mod-setting]
atmos-enemy-range-style-filled=Заливка
atmos-enemy-range-style-outline=Контур
atmos-enemy-range-style-filled-outline=Заливка + контур
