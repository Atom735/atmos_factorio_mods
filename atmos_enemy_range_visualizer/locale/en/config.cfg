[mod-name]
Atmos-Enemy-Range-Visualizer=Atmos Enemy Range Visualizer

[mod-description]
Atmos-Enemy-Range-Visualizer=Shows attack range circles around enemy worms, turrets, and artillery. Per-type colors, filled/outline styles, shortcut and in-game panel. Recommended companion: Gun Range Visualizer.

[shortcut-name]
atmos-enemy-range-toggle=Toggle enemy range visualizer

[controls]
atmos-enemy-range-toggle=Toggle enemy range visualizer
atmos-enemy-range-panel=Enemy range visualizer panel

[atmos-enemy-range]
open-settings=Enemy range visualizer settings
panel-title=Enemy range visualizer
enable=Show enemy ranges
style-label=Display style
show-lines=Show lines to enemies
show-lines-tooltip=Draw a line from your character to every visible enemy turret and worm. Opacity and width: Mod settings.
categories-label=Enemy types
cat-worms=Worms
cat-ammo=Ammo turrets
cat-electric=Electric / laser turrets
cat-fluid=Fluid / flamethrower turrets
cat-artillery=Artillery
hint-colors=Colors and search radius: Settings → Mod settings
close=Close
refresh=Refresh

[mod-setting-name]
atmos-enemy-range-style=Range circle style
atmos-enemy-range-search-radius=Search radius (tiles)
atmos-enemy-range-outline-width=Outline width (pixels)
atmos-enemy-range-show-lines=Show lines to enemies
atmos-enemy-range-line-alpha=Line opacity
atmos-enemy-range-line-width=Line width (pixels)
atmos-enemy-range-show-worms=Show worm ranges
atmos-enemy-range-show-ammo-turrets=Show ammo turret ranges
atmos-enemy-range-show-electric-turrets=Show electric turret ranges
atmos-enemy-range-show-fluid-turrets=Show fluid turret ranges
atmos-enemy-range-show-artillery=Show artillery ranges
atmos-enemy-range-color-worms=Worm range color
atmos-enemy-range-color-ammo=Ammo turret range color
atmos-enemy-range-color-electric=Electric turret range color
atmos-enemy-range-color-fluid=Fluid turret range color
atmos-enemy-range-color-artillery=Artillery range color

[mod-setting-description]
atmos-enemy-range-style=Filled circle, outline only, or filled with outline.
atmos-enemy-range-search-radius=How far from the player to look for enemy defenses.
atmos-enemy-range-outline-width=Line thickness for outline styles.
atmos-enemy-range-show-lines=Draw lines from your character to enemy turrets and worms, in the category color (panel can override per session).
atmos-enemy-range-line-alpha=Alpha of the lines (0.05–1). The color itself comes from the category color setting.
atmos-enemy-range-line-width=Thickness of the lines to enemies.
atmos-enemy-range-show-worms=Default for worm category (panel can override per session).
atmos-enemy-range-show-ammo-turrets=Default for ammo turrets (panel can override per session).
atmos-enemy-range-show-electric-turrets=Default for electric/laser turrets (panel can override per session).
atmos-enemy-range-show-fluid-turrets=Default for fluid/flamethrower turrets (panel can override per session).
atmos-enemy-range-show-artillery=Default for artillery turrets (panel can override per session).

[string-mod-setting]
atmos-enemy-range-style-filled=Filled
atmos-enemy-range-style-outline=Outline
atmos-enemy-range-style-filled-outline=Filled + outline
