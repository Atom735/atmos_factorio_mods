[mod-name]
Atmos-Machine-Tiers=Atmos Machine Tiers

[mod-description]
Atmos-Machine-Tiers=Adds upgrade tiers for assemblers, chemical plants, refineries, furnaces, mining drills and other production machines: craft 5 of the previous tier into 1 of the next. Each tier adds speed, a module slot and energy use. Original graphics with a tier badge. Many settings.

[atmos-machine-tiers]
tier-name=__1__ (Tier __2__)
master-name=__1__ (Master tier)

[mod-setting-name]
atmos-machine-tiers-max-tier=Number of tiers
atmos-machine-tiers-ingredient-count=Previous tier machines per upgrade
atmos-machine-tiers-scaling=Bonus scaling
atmos-machine-tiers-speed-bonus=Speed bonus per tier (%)
atmos-machine-tiers-energy-bonus=Energy use increase per tier (%)
atmos-machine-tiers-module-slots=Extra module slots per tier
atmos-machine-tiers-scale-pollution=Scale pollution with energy use
atmos-machine-tiers-assemblers=Tiers for assembling machines
atmos-machine-tiers-furnaces=Tiers for furnaces
atmos-machine-tiers-mining-drills=Tiers for mining drills
atmos-machine-tiers-labs=Tiers for labs
atmos-machine-tiers-offshore-pumps=Tiers for offshore pumps
atmos-machine-tiers-blacklist=Excluded machines
atmos-machine-tiers-overlay=Show tier badge on machines
atmos-machine-tiers-overlay-scale=Tier badge size
atmos-machine-tiers-overlay-alt-only=Tier badge only in alt mode

[mod-setting-description]
atmos-machine-tiers-max-tier=Highest tier, the base machine is tier 1. The last tier is the master tier with a star badge.
atmos-machine-tiers-ingredient-count=How many machines of the previous tier are crafted into one machine of the next tier.
atmos-machine-tiers-scaling=Linear: tier N gets (N-1) × bonus. Compound: each tier multiplies the previous one.
atmos-machine-tiers-speed-bonus=Crafting, mining or research speed added per tier. 100 = tier 2 is twice as fast as the base machine.
atmos-machine-tiers-energy-bonus=Energy use added per tier. 100 = tier 2 uses twice as much power.
atmos-machine-tiers-module-slots=Module slots added per tier on top of the base machine slots.
atmos-machine-tiers-scale-pollution=Pollution and other emissions grow together with energy use.
atmos-machine-tiers-assemblers=Assembling machines, chemical plants, oil refineries, centrifuges, and other assembling-machine type buildings (including Space Age and modded ones).
atmos-machine-tiers-furnaces=Stone, steel, electric furnaces and other furnace type buildings, including recyclers.
atmos-machine-tiers-mining-drills=Burner, electric and big mining drills, pumpjacks and other mining drill type buildings (mining speed).
atmos-machine-tiers-labs=Labs (research speed instead of crafting speed).
atmos-machine-tiers-offshore-pumps=Offshore pumps (pumping speed; no module slots).
atmos-machine-tiers-blacklist=Comma-separated entity names that never get tiers, e.g. centrifuge, pumpjack.
atmos-machine-tiers-overlay=Draw the tier digit (or a star for the master tier) in the top-right corner of placed tiered machines.
atmos-machine-tiers-overlay-scale=Size of the tier badge on machines.
atmos-machine-tiers-overlay-alt-only=Show the tier badge only when alt mode is on.

[string-mod-setting]
atmos-machine-tiers-scaling-linear=Linear
atmos-machine-tiers-scaling-compound=Compound