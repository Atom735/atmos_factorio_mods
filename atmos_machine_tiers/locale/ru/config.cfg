[mod-name]
Atmos-Machine-Tiers=Atmos Machine Tiers

[mod-description]
Atmos-Machine-Tiers=Добавляет тиры для сборочных автоматов, химзаводов, нефтепереработки, печей, буров и других производственных машин: 5 машин предыдущего тира крафтятся в 1 следующего. Каждый тир добавляет скорость, слот модуля и потребление энергии. Оригинальная графика со значком тира. Много настроек.

[atmos-machine-tiers]
tier-name=__1__ (тир __2__)
master-name=__1__ (мастер-тир)

[mod-setting-name]
atmos-machine-tiers-max-tier=Количество тиров
atmos-machine-tiers-ingredient-count=Машин предыдущего тира на улучшение
atmos-machine-tiers-scaling=Рост бонусов
atmos-machine-tiers-speed-bonus=Бонус скорости за тир (%)
atmos-machine-tiers-energy-bonus=Рост потребления энергии за тир (%)
atmos-machine-tiers-module-slots=Доп. слоты модулей за тир
atmos-machine-tiers-scale-pollution=Загрязнение растёт вместе с энергией
atmos-machine-tiers-assemblers=Тиры для сборочных автоматов
atmos-machine-tiers-furnaces=Тиры для печей
atmos-machine-tiers-mining-drills=Тиры для буров
atmos-machine-tiers-labs=Тиры для лабораторий
atmos-machine-tiers-offshore-pumps=Тиры для морских насосов
atmos-machine-tiers-blacklist=Исключённые машины
atmos-machine-tiers-overlay=Значок тира на машинах
atmos-machine-tiers-overlay-scale=Размер значка тира
atmos-machine-tiers-overlay-alt-only=Значок тира только в alt-режиме

[mod-setting-description]
atmos-machine-tiers-max-tier=Высший тир, базовая машина — тир 1. Последний тир — мастер-тир со звездой.
atmos-machine-tiers-ingredient-count=Сколько машин предыдущего тира крафтится в одну машину следующего.
atmos-machine-tiers-scaling=Линейно: тир N получает (N-1) × бонус. Сложно: каждый тир умножает предыдущий.
atmos-machine-tiers-speed-bonus=Скорость крафта, добычи или исследования за тир. 100 = тир 2 вдвое быстрее базовой машины.
atmos-machine-tiers-energy-bonus=Прибавка потребления энергии за тир. 100 = тир 2 потребляет вдвое больше.
atmos-machine-tiers-module-slots=Слоты модулей за тир сверх слотов базовой машины.
atmos-machine-tiers-scale-pollution=Загрязнение и другие выбросы растут вместе с потреблением энергии.
atmos-machine-tiers-assemblers=Сборочные автоматы, химзаводы, нефтепереработка, центрифуги и другие здания типа assembling-machine (включая Space Age и моды).
atmos-machine-tiers-furnaces=Каменные, стальные, электрические печи и другие здания типа furnace, включая переработчики.
atmos-machine-tiers-mining-drills=Твердотопливные, электрические и большие буры, нефтекачалки и другие здания типа mining-drill (скорость добычи).
atmos-machine-tiers-labs=Лаборатории (скорость исследования вместо скорости крафта).
atmos-machine-tiers-offshore-pumps=Морские насосы (скорость откачки; без слотов модулей).
atmos-machine-tiers-blacklist=Имена сущностей через запятую, которым тиры не нужны, например centrifuge, pumpjack.
atmos-machine-tiers-overlay=Рисовать цифру тира (или звезду для мастер-тира) в правом верхнем углу поставленных машин.
atmos-machine-tiers-overlay-scale=Размер значка тира на машинах.
atmos-machine-tiers-overlay-alt-only=Показывать значок тира только в alt-режиме.

[string-mod-setting]
atmos-machine-tiers-scaling-linear=Линейно
atmos-machine-tiers-scaling-compound=Сложно (множитель)