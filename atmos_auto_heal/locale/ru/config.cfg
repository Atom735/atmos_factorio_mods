[mod-name]
Atmos-Auto-Heal=Atmos Auto Heal

[mod-description]
Atmos-Auto-Heal=Автоматически съедает рыбу, лечебные капсулы или любой другой предмет самолечения из инвентаря, когда здоровье падает ниже порога. Индивидуальный список приоритетов для каждого игрока. Несовместим с Auto Fish and Heal (auto-fish).

[shortcut-name]
atmos-auto-heal-toggle=Переключить автолечение

[controls]
atmos-auto-heal-toggle=Переключить автолечение
atmos-auto-heal-panel=Панель приоритетов автолечения

[atmos-auto-heal]
open-settings=Настройки автолечения
panel-title=Приоритеты автолечения
enable=Автолечение включено
priority-hint=Предметы используются сверху вниз. Снимите галочку, чтобы никогда не использовать предмет.
no-items=В загруженных модах не найдено предметов самолечения.
item-enabled-tooltip=Разрешить автолечению использовать этот предмет
move-up=Выше
move-down=Ниже
reset=Сбросить порядок
close=Закрыть

[mod-setting-name]
atmos-auto-heal-threshold=Лечить ниже здоровья (%)
atmos-auto-heal-avoid-overheal=Не тратить лечение впустую

[mod-setting-description]
atmos-auto-heal-threshold=Автолечение срабатывает, когда здоровье персонажа падает ниже этого процента.
atmos-auto-heal-avoid-overheal=Пропускать предметы, которые вылечат больше недостающего здоровья, если есть разрешённый предмет поменьше. Иначе используется первый разрешённый предмет.
