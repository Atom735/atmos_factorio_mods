[mod-name]
Atmos-Auto-Heal=Atmos Auto Heal

[mod-description]
Atmos-Auto-Heal=Automatically eats fish, healing capsules, or any other self-healing item from your inventory when health drops below a threshold. Per-player priority list. Incompatible with Auto Fish and Heal (auto-fish).

[shortcut-name]
atmos-auto-heal-toggle=Toggle auto heal

[controls]
atmos-auto-heal-toggle=Toggle auto heal
atmos-auto-heal-panel=Auto heal priority panel

[atmos-auto-heal]
open-settings=Auto heal settings
panel-title=Auto heal priorities
enable=Auto heal enabled
priority-hint=Items are used top to bottom. Uncheck to never use an item.
no-items=No self-healing items found in loaded mods.
item-enabled-tooltip=Allow auto heal to use this item
move-up=Move up
move-down=Move down
reset=Reset order
close=Close

[mod-setting-name]
atmos-auto-heal-threshold=Heal below health (%)
atmos-auto-heal-avoid-overheal=Avoid wasting heals

[mod-setting-description]
atmos-auto-heal-threshold=Auto heal triggers when character health drops below this percentage.
atmos-auto-heal-avoid-overheal=Skip items that would heal more than the missing health while a smaller allowed item is available. Falls back to the first allowed item otherwise.
